<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML 5</title>
</head>
<body>

    <h1>Imagem dinâmica</h1>

    <p>
        Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.
    </p>

    <picture>
        
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">

        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">

        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>


    <h1>Reproduzindo Áudio</h1>

    <p>Vamos aprender a reproduzir áudios em HTML 5.</p>

    <!--Formatos para áudio MP3 WAV OGG-->
    <audio
     src="midia/Linux_do_Rover_de_Marte_ao_computador.m4a" controls>
    </audio>

    <audio preload="metadata" autoplay loop>

        <source src="midia/Linux_do_Rover_de_Marte_ao_computador.m4a" type="audio/mpeg"> 

        <p>Infelizmente seu navegador não pode reproduzir áudio <a href="midia/Linux_do_Rover_de_Marte_ao_computador.m4a":Clique aqui para baixar o arquivo></a></p>

    </audio>
    

</body>
</html>
